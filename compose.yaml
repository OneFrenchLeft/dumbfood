name: dumbfood

services:
  app:
    image: dumbfood:local
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/dumbfood.sqlite
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Exécutez node scripts/setup.mjs pour créer .env}"
      SESSION_SECRET: "${SESSION_SECRET:?Exécutez node scripts/setup.mjs pour créer .env}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      DEMO_DATA: "${DEMO_DATA:-false}"
    volumes:
      - dumbfood-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 20s

volumes:
  dumbfood-data:
